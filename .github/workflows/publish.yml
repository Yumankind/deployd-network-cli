# Publish to npm when a GitHub release is created.
#
# Needs one repository secret: NPM_TOKEN — an npm "Automation" token from
# npmjs.com → Access Tokens. Nothing publishes without it, and nothing
# publishes on ordinary pushes: cutting a release is the deliberate act.
name: publish
on:
  release:
    types: [created]
jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write   # npm provenance
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org
      - run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
